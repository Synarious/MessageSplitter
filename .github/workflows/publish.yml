name: Test and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - name: Run release regression tests
        shell: bash
        run: |
          for test in tests/*.py; do
            python -B "$test"
          done

      - name: Run Lua regression tests
        run: python -B .github/scripts/run_lua_tests.py

  release:
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/dev')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: addon-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare version and clean addon directory
        id: prepare
        run: python .github/scripts/release.py
      - name: Commit version and push release tag
        if: steps.prepare.outputs.bumped == 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MessageSplitter.toc
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
          git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/${RELEASE_TAG}"
      - name: Check out BigWigs packager
        uses: actions/checkout@v6
        with:
          repository: BigWigsMods/packager
          ref: v2
          path: .release-tools/packager
          persist-credentials: false
      - name: Package and release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          INPUT_PANDOC: 'true'
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || '0' }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Set the tag context in this shell; reserved GITHUB_* defaults cannot be set via env.
          export GITHUB_REF="refs/tags/${RELEASE_TAG}"
          export GITHUB_REF_NAME="$RELEASE_TAG"
          export INPUT_ARGS="-c -o -n {package-name} -p ${CF_PROJECT_ID}"
          bash .release-tools/packager/setup-packager.sh
          # Keep the runtime-only directory prepared by release.py.
          bash .release-tools/packager/release.sh -t "$GITHUB_WORKSPACE" -c -o -n "{package-name}" -p "$CF_PROJECT_ID"
          test -s .release/MessageSplitter.zip
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx 'MessageSplitter.zip'
